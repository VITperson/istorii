<title>Чужой груз</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=PT+Sans+Caption:wght@400;700&family=Marck+Script&display=swap">
<style>
/* Layout: одна узкая колонка. Цвета и значок на входе задаёт страница.json героя. */
:root {
  color-scheme: dark;
  --soot: #15120f;
  --soot-2: #201b17;
  --bone: #efe7da;
  --ash: #b3a796;
  --silver: #d08f4e;
  --ember: #e3b06a;
  --paper: #d9c9a3;      /* бумага записки */
  --ink: #2c2519;        /* чернила */
  --line: #3a3129;
  --display: "Oranienbaum", "Times New Roman", serif;
  --text: "Literata", Georgia, "Times New Roman", serif;
  --util: "PT Sans Caption", "Helvetica Neue", Arial, sans-serif;
  --hand: "Marck Script", "Segoe Script", cursive;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--soot); color: var(--bone); font-family: var(--text); font-size: 18px; line-height: 1.62; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--silver); outline-offset: 2px; }

/* вход */
.gate { min-height: 100%; display: grid; place-items: center; padding-block: 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.gate-box { width: 100%; max-width: 340px; display: grid; gap: 22px; }
.gate-spoon { width: 84px; height: 84px; color: var(--silver); justify-self: center; }
.gate h1 { font-family: var(--display); font-weight: 400; font-size: 42px; line-height: 1.05; margin: 0; text-align: center; text-wrap: balance; }
.gate p { margin: 0; font-family: var(--util); font-size: 14px; line-height: 1.5; color: var(--ash); text-align: center; }
.gate form { display: grid; gap: 14px; }
.gate label { display: grid; gap: 6px; font-family: var(--util); font-size: 13px; color: var(--ash); }
.gate input { width: 100%; font-family: var(--util); font-size: 18px; color: var(--bone); background: var(--soot-2); border: 1px solid var(--line); border-radius: 3px; padding: 13px 14px; }
.gate input:focus { border-color: var(--silver); outline: none; }
.gate .go { font-family: var(--util); font-weight: 700; font-size: 16px; background: var(--silver); color: var(--soot); border-radius: 3px; padding: 15px; }
.gate .go[disabled] { opacity: .6; }
.err { color: var(--ember) !important; min-height: 21px; }
@keyframes nope { 25% { transform: translateX(-7px);} 75% { transform: translateX(7px);} }
.shake { animation: nope .28s linear 2; }

/* история */
#story { padding-bottom: 96px; }
.cover { position: relative; max-width: 620px; margin-inline: auto; }
.cover-img { display: block; width: 100%; height: auto; }
.cover-text { padding-block: 26px 6px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.cover-who { margin: 0 0 4px; font-family: var(--util); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--ember); }
.cover h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(50px, 15vw, 76px); line-height: 1; text-wrap: balance; }
.warn, .listen, .menu, main { max-width: 620px; margin-inline: auto; }
.warn { margin-top: 26px; margin-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding: 20px; background: var(--ember); color: var(--soot); border-radius: 3px; font-family: var(--util); font-size: 15px; line-height: 1.5; }
@media (min-width: 652px) { .warn { margin-inline: auto; } }
.warn h2 { margin: 0 0 8px; font-size: 18px; }
.warn p { margin: 0 0 9px; }
.warn p:last-child { margin: 0; }
.listen { display: flex; align-items: center; gap: 16px; width: calc(100% - 32px); margin-top: 18px; padding: 15px 16px; border: 1px solid var(--line); border-radius: 3px; background: var(--soot-2); font-family: var(--util); font-size: 16px; font-weight: 700; text-align: left; }
@media (min-width: 652px) { .listen { width: 100%; } }
.listen small { display: block; margin-top: 2px; font-weight: 400; font-size: 13px; color: var(--ash); }
.listen-ico { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--silver); position: relative; }
.listen-ico::after { content: ""; position: absolute; left: 17px; top: 13px; border-left: 15px solid var(--soot); border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
.menu { margin-top: 36px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.menu-title { margin: 0 0 10px; font-family: var(--display); font-size: 25px; }
.menu ol { list-style: none; margin: 0; padding: 0; }
.menu-row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; width: 100%; padding: 11px 0; border-bottom: 1px dotted var(--line); text-align: left; }
.menu-kind { font-family: var(--util); font-size: 13px; color: var(--ash); }
.menu-name { font-size: 18px; text-align: right; min-width: 0; }

main { display: grid; gap: 56px; margin-top: 56px; }
.course { display: grid; gap: 22px; min-width: 0; scroll-margin-top: 16px; }
.course-head, .dan, .nar, .note, .last { margin-left: max(20px, env(safe-area-inset-left, 0px)); margin-right: max(20px, env(safe-area-inset-right, 0px)); }
.course-kind { font-family: var(--util); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--ember); }
.course-head h2 { margin: 4px 0 0; font-family: var(--display); font-weight: 400; font-size: 38px; line-height: 1.08; text-wrap: balance; }
.dan p { margin: 0 0 1em; }
.dan p:last-child { margin: 0; }
.nar { font-family: var(--util); font-size: 15px; line-height: 1.55; color: var(--ash); padding-top: 12px; border-top: 1px dotted var(--line); }
.nar-label { display: block; margin-bottom: 7px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ember); }
.nar p { margin: 0 0 .8em; }
.nar p:last-child { margin: 0; color: var(--bone); }
.plate { margin: 0; }
.plate img { display: block; width: 100%; height: auto; }
.note { background: var(--paper); color: var(--ink); padding: 26px 22px; font-family: var(--hand); font-size: 25px; line-height: 1.35; transform: rotate(-1.4deg); box-shadow: 0 6px 24px rgba(0,0,0,.45); }
.note p { margin: 0; }
.last { margin-top: 26px; margin-bottom: 0; font-family: var(--display); font-size: 40px; line-height: 1.1; text-align: right; color: var(--silver); }

/* плеер */
.player { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; align-items: center; gap: 14px; background: var(--soot-2); border-top: 1px solid var(--line); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); font-family: var(--util); }
.p-btn { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--silver); position: relative; }
.p-btn::after { content: ""; position: absolute; left: 17px; top: 13px; border-left: 15px solid var(--soot); border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
.p-btn.on::after { left: 15px; top: 14px; width: 14px; height: 16px; border: 0; border-left: 5px solid var(--soot); border-right: 5px solid var(--soot); }
.p-mid { flex: 1; min-width: 0; display: grid; gap: 4px; }
.p-now { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-mid input { width: 100%; margin: 0; accent-color: var(--silver); }
.p-t { flex: none; font-size: 12px; color: var(--ash); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
</style>

<div class="gate" id="gate">
  <div class="gate-box" id="box">
    <svg class="gate-spoon" viewBox="0 0 84 84" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="42" cy="42" r="30"/><circle cx="42" cy="42" r="24"/><circle cx="42" cy="42" r="7"/><path d="M24 22 L33 24 L31 33 L22 31 Z"/><path d="M52 55 L61 53 L63 61 L54 63 Z"/><circle cx="42" cy="15" r="1.2"/><circle cx="69" cy="42" r="1.2"/><circle cx="42" cy="69" r="1.2"/><circle cx="15" cy="42" r="1.2"/></svg>
    <h1>Чужой груз</h1>
    <p>Это личная история одного героя. Войди под своим именем и PIN-кодом из кабинета.</p>
    <form id="f" autocomplete="off">
      <label for="login">Имя<input id="login" name="login" type="text" autocapitalize="words" autocomplete="off" required></label>
      <label for="pin">PIN-код<input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="off" required></label>
      <button class="go" id="go" type="submit">Открыть</button>
    </form>
    <p class="err" id="err" role="alert"></p>
  </div>
</div>
<div id="story" hidden></div>
<div class="player" id="player" hidden>
  <button type="button" class="p-btn" id="pbtn" aria-label="Пауза"></button>
  <div class="p-mid"><span class="p-now" id="pnow"></span><input id="pseek" type="range" min="0" max="1000" value="0" aria-label="Перемотка"></div>
  <span class="p-t" id="pt">0:00</span>
</div>

<script>
(function () {
  var ITER = 310000;
  var $ = function (id) { return document.getElementById(id); };
  function bytes(b64) { var s = atob(b64), n = s.length, u = new Uint8Array(n); for (var i = 0; i < n; i++) u[i] = s.charCodeAt(i); return u; }

  async function open(login, pin) {
    var raw = bytes($('vault').textContent.trim());
    var enc = new TextEncoder().encode(login.trim().normalize('NFC').toLowerCase() + ':' + pin.trim());
    var base = await crypto.subtle.importKey('raw', enc, 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: raw.slice(0, 16), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(16, 28) }, key, raw.slice(28));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  $('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var go = $('go'), err = $('err');
    err.textContent = '';
    go.disabled = true; go.textContent = 'Открываю…';
    await new Promise(function (r) { setTimeout(r, 30); });
    try {
      var data = await open($('login').value, $('pin').value);
      render(data);
    } catch (x) {
      go.disabled = false; go.textContent = 'Открыть';
      err.textContent = window.crypto && crypto.subtle ? 'Имя или PIN не подошли. Проверь и попробуй ещё раз.' : 'Этот браузер не может открыть страницу. Открой ссылку в Safari или Chrome.';
      var box = $('box'); box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    }
  });

  function render(d) {
    var st = $('story');
    st.innerHTML = d.html;
    st.querySelectorAll('img[data-src]').forEach(function (im) { im.src = 'data:image/webp;base64,' + d.images[im.dataset.src]; });
    $('gate').hidden = true; st.hidden = false;
    window.scrollTo(0, 0);
    if (d.audio) setupAudio(d, st);
    st.querySelectorAll('[data-go]').forEach(function (b) {
      b.addEventListener('click', function () {
        var i = +b.dataset.go;
        var sec = $('c' + i); if (sec) sec.scrollIntoView();
        if (playing && d.chapters[i] != null) a.currentTime = d.chapters[i];
      });
    });
  }

  var a = $('a'), playing = false;
  function mmss(t) { t = Math.max(0, t | 0); return (t / 60 | 0) + ':' + ('0' + t % 60).slice(-2); }

  function setupAudio(d, st) {
    var bin = bytes(d.audio), triedData = false;
    d.audio = null;
    a.src = URL.createObjectURL(new Blob([bin], { type: 'audio/mpeg' }));
    a.addEventListener('error', function () {
      if (triedData) return;
      triedData = true;
      var parts = [], step = 0x8000;
      for (var i = 0; i < bin.length; i += step) parts.push(String.fromCharCode.apply(null, bin.subarray(i, i + step)));
      var wasOn = playing;
      a.src = 'data:audio/mpeg;base64,' + btoa(parts.join(''));
      if (wasOn) a.play().catch(function () {});
    });
    var names = [].map.call(st.querySelectorAll('.course'), function (s) { return s.querySelector('.course-kind').textContent + '. ' + s.querySelector('h2').textContent; });
    var seeking = false;
    function start() { $('player').hidden = false; a.play().catch(function () {}); }
    $('listen').addEventListener('click', function () { if (playing) { a.pause(); } else { start(); } });
    $('pbtn').addEventListener('click', function () { if (a.paused) a.play().catch(function () {}); else a.pause(); });
    a.addEventListener('play', function () { playing = true; $('pbtn').classList.add('on'); $('pbtn').setAttribute('aria-label', 'Пауза'); });
    a.addEventListener('pause', function () { playing = false; $('pbtn').classList.remove('on'); $('pbtn').setAttribute('aria-label', 'Слушать'); });
    a.addEventListener('timeupdate', function () {
      if (!a.duration) return;
      if (!seeking) $('pseek').value = Math.round(a.currentTime / a.duration * 1000);
      $('pt').textContent = mmss(a.currentTime);
      var c = 0; for (var i = 0; i < d.chapters.length; i++) if (a.currentTime + .2 >= d.chapters[i]) c = i;
      $('pnow').textContent = names[c] || '';
    });
    $('pseek').addEventListener('input', function () { seeking = true; });
    $('pseek').addEventListener('change', function () { if (a.duration) a.currentTime = this.value / 1000 * a.duration; seeking = false; });
  }
})();
</script>
